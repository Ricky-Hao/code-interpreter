services:
  sandbox-runner:
    build:
      target: sandbox-runner-full-debian
    environment:
      - LAUNCHER_VCPUS=${LAUNCHER_VCPUS:-1}
      - LAUNCHER_RAM_MIB=${LAUNCHER_RAM_MIB:-1792}
      - SANDBOX_VM_MAX_CONCURRENT=${SANDBOX_VM_MAX_CONCURRENT:-2}
      - SANDBOX_VM_SCRATCH_SIZE_MIB=${SANDBOX_VM_SCRATCH_SIZE_MIB:-8192}
      - SANDBOX_VM_BOOT_TIMEOUT_SECONDS=${SANDBOX_VM_BOOT_TIMEOUT_SECONDS:-45}
      - SANDBOX_VM_REQUEST_TIMEOUT_SECONDS=${SANDBOX_VM_REQUEST_TIMEOUT_SECONDS:-180}